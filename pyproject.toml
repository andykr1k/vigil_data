[project]
name = "vigil"
version = "0.1.0"
description = "RealSense leg pose estimation (SAM 3D Body / ViTPose+depth) with a live 3D web dashboard"
readme = "README.md"
authors = [
    { name = "Andrew Krikorian", email = "akrikorian12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "braceexpand>=0.1.7",
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyrealsense2>=2.58.4.10922",
    "python-dotenv>=1.2.3",
    "pytorch-lightning>=2.6.6",
    "pyyaml>=6.0.3",
    "roma>=1.6.1",
    "scipy>=1.18.1",
    "termcolor>=3.3.0",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
    "yacs>=0.1.8",
]

[project.scripts]
vigil = "vigil:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# This machine sources ROS, which auto-registers pytest plugins that crash on import.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_pep257 -p no:ament_flake8 -p no:ament_xmllint -p no:ament_copyright -p no:ament_lint"
